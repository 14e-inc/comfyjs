steps:
  - label: "📦 Install & Test"
    commands:
      - "corepack enable"                        # Activates pnpm if configured in package.json
      - "pnpm config set store-dir .pnpm-store"  # Point pnpm store to local workspace folder
      - "pnpm install --frozen-lockfile"         # Fast, deterministic installation
      - "pnpm test"
    plugins:
      - buildkite-plugins/cache#v2.11.0:
          backend: s3                            # Or use 'gcs' / 'file' depending on infrastructure
          key: "v1-pnpm-store-{{ checksum 'pnpm-lock.yaml' }}"
          paths:
            - ".pnpm-store"
  - command: echo "I will stick!"
    agents:
      hostname: "$BUILDKITE_AGENT_META_DATA_HOSTNAME"
  - command: |
      ls -la
      cd packages
      ls -la
      cd comfy-auth-util
      npm ci
      npm build